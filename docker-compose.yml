services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: proxy_manager
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: Proxy Manager
      APP_ENV: local
      APP_KEY: base64:hJeBBq3IwZZHDP8oxdiVQX9KpUC1LZo/+9rvGqm2v48=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URLS: http://localhost:5173,http://127.0.0.1:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proxy_manager
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: php artisan schedule:work
    environment:
      APP_NAME: Proxy Manager
      APP_ENV: local
      APP_KEY: base64:hJeBBq3IwZZHDP8oxdiVQX9KpUC1LZo/+9rvGqm2v48=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proxy_manager
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
